.btn-p{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#05080f}
.btn-o{background:transparent;border:1px solid var(--border);color:var(--text)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:#0a1220;border:1px solid var(--accent);padding:12px 18px;border-radius:12px;z-index:99;opacity:0;transition:0.3s;font-weight:600;max-width:90%;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

<script>
function toast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(function(){ t.classList.remove("show"); }, 3000);
}

document.getElementById("btnCopy").addEventListener("click", function(){
  var text = document.getElementById("ovpnText").value;
  if(navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function(){ toast("✅ کانفیگ با موفقیت کپی شد"); });
  } else {
    var ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    toast("✅ کپی شد");
  }
});

document.getElementById("btnDownload").addEventListener("click", function(){
  var text = document.getElementById("ovpnText").value;
  var blob = new Blob([text], {type: "application/x-openvpn-profile;charset=utf-8"});
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url;
  a.download = "gaming_config.ovpn";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
  toast("⬇️ فایل ovpn. دانلود شد");
});
</script>
